name: Micha DEV list versions

on:
  push:
    branches: [contingency-dev]
    paths:
      - '.github/workflows/micha-dev-list-versions.yml'

permissions:
  contents: read

jobs:
  list-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Safety
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: List michayco-dev versions only
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions list --name michayco-dev
