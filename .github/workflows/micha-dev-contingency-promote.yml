name: Micha DEV contingency - promote validated candidate

on:
  push:
    branches: [contingency-dev]
    paths:
      - 'contingency/promote-trigger.txt'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: michayco-dev
      BASE_VERSION: 8dcc9891-93f3-456b-91d4-25b46a60a420
      CANDIDATE_VERSION: b582c3d4-5838-4f7c-b6f5-ff0efad76a46
      BASE_RELEASE: dev-ui-clean-37
      CANDIDATE_RELEASE: dev-ui-clean-38
    steps:
      - uses: actions/checkout@v4
      - name: Preflight DEV safety
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKER" = "michayco-dev"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          CURRENT="$(curl -fsS -A 'Mozilla/5.0' https://dev.michahome.com.ar/health | python3 -c "import json,sys; print(json.load(sys.stdin)['release'])")"
          test "$CURRENT" = "$BASE_RELEASE" || { echo "Unexpected active release: $CURRENT" >&2; exit 90; }
      - name: Promote validated DEV UI release
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy "$CANDIDATE_VERSION@100" --name "$WORKER" --yes --message "Promote validated DEV UI clean 38"
      - name: Wait for propagation and validate promoted release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, os, requests
          want=os.environ['CANDIDATE_RELEASE']; consecutive=0; deadline=time.time()+180; seen={}
          while time.time()<deadline:
              try:
                  out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?promote={time.time_ns()}'])
                  j=json.loads(out); r=j.get('release'); seen[r]=seen.get(r,0)+1
                  assert j.get('ok') is True and j.get('target')=='michayco-dev' and j.get('production_locked') is True
                  consecutive=consecutive+1 if r==want else 0
                  if consecutive>=12: break
              except Exception: consecutive=0
              time.sleep(1)
          else: raise SystemExit(f'promoted_release_not_stable seen={seen}')
          css=requests.get('https://dev.michahome.com.ar/canonical-admin-ui.css?x='+str(time.time_ns())).text
          assert 'Final Stock / Fragancias column alignment contract.' in css
          assert '#catalogWorkspace.canonical-stock-screen .stock-sheet thead th:nth-child(4){text-align:left!important}' in css
          assert 'grid-template-columns:minmax(270px,1.35fr) minmax(250px,1fr) 84px 128px!important' in css
          print(json.dumps({'stable_release':want,'seen':seen,'stock_fragancias_alignment':'ok'}))
          PY
          test "$(curl -sS -o /dev/null -w '%{http_code}' -I https://dev.michahome.com.ar/admin)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -I https://dev.michahome.com.ar/)" = "200"
      - name: Emergency rollback on promotion failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy "$BASE_VERSION@100" --name "$WORKER" --yes --message "Emergency restore DEV UI clean 37"
