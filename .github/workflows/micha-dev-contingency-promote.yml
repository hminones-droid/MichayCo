name: Micha DEV contingency - promote validated candidate

on:
  push:
    branches: [contingency-dev]
    paths:
      - 'contingency/promote-trigger.txt'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: michayco-dev
      BASE_VERSION: 2da4244f-f757-4b27-8e62-82cece3c3736
      CANDIDATE_VERSION: 9641e736-9cc1-429c-92af-109520b3787f
      BASE_RELEASE: dev-product-duplicate-components-20261017-13
      CANDIDATE_RELEASE: dev-product-duplicate-easy-edit-20261017-14
    steps:
      - uses: actions/checkout@v4

      - name: Preflight DEV safety
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKER" = "michayco-dev"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          CURRENT="$(curl -fsS -A 'Mozilla/5.0' https://dev.michahome.com.ar/health | python3 -c "import json,sys; print(json.load(sys.stdin)['release'])")"
          test "$CURRENT" = "$BASE_RELEASE" || { echo "Unexpected active release: $CURRENT" >&2; exit 90; }

      - name: Promote candidate to 100 percent DEV
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$CANDIDATE_VERSION@100" \
            --name "$WORKER" --yes \
            --message "Make duplicated products inherit composition and allow one-click component replacement in DEV"

      - name: Wait for propagation and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, os
          want=os.environ['CANDIDATE_RELEASE']; consecutive=0; deadline=time.time()+120; seen={}
          while time.time()<deadline:
              try:
                  out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?promote={time.time_ns()}'])
                  j=json.loads(out); r=j.get('release'); seen[r]=seen.get(r,0)+1
                  assert j.get('ok') is True and j.get('target')=='michayco-dev' and j.get('production_locked') is True
                  consecutive=consecutive+1 if r==want else 0
                  if consecutive>=12: print(json.dumps({'stable_release':want,'seen':seen})); break
              except Exception: consecutive=0
              time.sleep(1)
          else: raise SystemExit(f'candidate_not_stable seen={seen}')
          PY
          curl -fsS -A 'Mozilla/5.0' 'https://dev.michahome.com.ar/product-duplicate-fixes.js?verify=1' -o /tmp/product-duplicate-fixes.js
          grep -q 'duplicateProductCanonical' /tmp/product-duplicate-fixes.js
          grep -q 'replaceProductSupply' /tmp/product-duplicate-fixes.js
          grep -q 'data-replace-supply' /tmp/product-duplicate-fixes.js
          grep -q "sb.from('product_supplies').insert(rows)" /tmp/product-duplicate-fixes.js
          grep -q 'stock:0' /tmp/product-duplicate-fixes.js
          grep -q 'published:false' /tmp/product-duplicate-fixes.js
          node --check /tmp/product-duplicate-fixes.js
          curl -fsS -A 'Mozilla/5.0' 'https://dev.michahome.com.ar/admin?verify=1' -o /tmp/admin.html
          grep -q '/product-duplicate-fixes.js' /tmp/admin.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' -I https://dev.michahome.com.ar/admin)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://dev.michahome.com.ar/__product_duplicate_missing__)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://dev.michahome.com.ar/admin)" = "405"

      - name: Emergency rollback on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$BASE_VERSION@100" \
            --name "$WORKER" --yes \
            --message "Emergency rollback after easier product duplicate DEV deployment failure"

      - name: Verify rollback if needed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, os
          want=os.environ['BASE_RELEASE']; consecutive=0; deadline=time.time()+120
          while time.time()<deadline:
              try:
                  out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?rollback={time.time_ns()}'])
                  j=json.loads(out); consecutive=consecutive+1 if j.get('release')==want else 0
                  if consecutive>=12: print('baseline_restored'); break
              except Exception: consecutive=0
              time.sleep(1)
          else: raise SystemExit('baseline_not_restored')
          PY
