name: Micha DEV contingency - promote validated candidate

on:
  push:
    branches: [contingency-dev]
    paths:
      - 'contingency/promote-trigger.txt'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: michayco-dev
      BASE_VERSION: e8424175-b848-438d-a834-9c13f3791219
      CANDIDATE_VERSION: b18ff18b-9f81-4158-87cd-b5f4c1e0294c
      BASE_RELEASE: dev-product-primary-inheritance-20261015-4
      CANDIDATE_RELEASE: dev-recipe-calculation-20261015-5
    steps:
      - uses: actions/checkout@v4

      - name: Preflight DEV safety
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKER" = "michayco-dev"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          CURRENT="$(curl -fsS -A 'Mozilla/5.0' https://dev.michahome.com.ar/health | python3 -c "import json,sys; print(json.load(sys.stdin)['release'])")"
          test "$CURRENT" = "$BASE_RELEASE" || { echo "Unexpected active release: $CURRENT" >&2; exit 90; }

      - name: Promote candidate to 100 percent DEV
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$CANDIDATE_VERSION@100" \
            --name "$WORKER" --yes \
            --message "Deploy recipe-calculated component quantities to DEV"

      - name: Wait for propagation and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, os
          want=os.environ['CANDIDATE_RELEASE']; consecutive=0; deadline=time.time()+120; seen={}
          while time.time()<deadline:
              try:
                  out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?promote={time.time_ns()}'])
                  j=json.loads(out); r=j.get('release'); seen[r]=seen.get(r,0)+1
                  assert j.get('ok') is True and j.get('target')=='michayco-dev' and j.get('production_locked') is True
                  consecutive=consecutive+1 if r==want else 0
                  if consecutive>=12: print(json.dumps({'stable_release':want,'seen':seen})); break
              except Exception: consecutive=0
              time.sleep(1)
          else: raise SystemExit(f'candidate_not_stable seen={seen}')
          PY
          python3 - <<'PY'
          import subprocess, time
          checks={
            '/catalog-admin-v2.js':['productSupplyCalculatedLabel',"quantity_rule==='by_recipe'","category.includes('vela')",'capacity_g'],
            '/catalog-admin-v2-products.js':['productCanonicalName'],
            '/app.js':['productDisplayName'],
          }
          for path,markers in checks.items():
              deadline=time.time()+60
              target='/tmp/'+path.rsplit('/',1)[-1]
              while time.time()<deadline:
                  q=f'{time.time_ns()}'
                  p=subprocess.run(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar{path}?verify={q}','-o',target])
                  if p.returncode==0:
                      body=open(target,encoding='utf-8').read()
                      if all(m in body for m in markers):
                          print(f'candidate_asset_ok {path}')
                          break
                  time.sleep(1)
              else:
                  raise SystemExit(f'candidate_asset_not_stable {path}')
          PY
          node --check /tmp/catalog-admin-v2.js
          node --check /tmp/catalog-admin-v2-products.js
          node --check /tmp/app.js
          test "$(curl -sS -o /dev/null -w '%{http_code}' -I https://dev.michahome.com.ar/admin)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://dev.michahome.com.ar/__recipe_missing__)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://dev.michahome.com.ar/admin)" = "405"

      - name: Emergency rollback on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$BASE_VERSION@100" \
            --name "$WORKER" --yes \
            --message "Emergency rollback after recipe calculation DEV deployment failure"

      - name: Verify rollback if needed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, os
          want=os.environ['BASE_RELEASE']; consecutive=0; deadline=time.time()+120
          while time.time()<deadline:
              try:
                  out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?rollback={time.time_ns()}'])
                  j=json.loads(out); consecutive=consecutive+1 if j.get('release')==want else 0
                  if consecutive>=12: print('baseline_restored'); break
              except Exception: consecutive=0
              time.sleep(1)
          else: raise SystemExit('baseline_not_restored')
          PY
