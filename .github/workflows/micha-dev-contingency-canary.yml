name: Micha DEV contingency - canary and rollback

on:
  push:
    branches: [contingency-dev]
    paths:
      - 'contingency/canary-trigger.txt'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: michayco-dev
      BASE_VERSION: 83c56e5d-1323-4ed7-88a6-4d5807c4992c
      CANDIDATE_VERSION: 7ba17dde-3349-4ef2-bf6b-3d0a006f16be
      BASE_RELEASE: dev-visibility-filter-fix-20261016-7
      CANDIDATE_RELEASE: dev-stock-aroma-20261016-8
    steps:
      - uses: actions/checkout@v4

      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKER" = "michayco-dev"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          CURRENT="$(curl -fsS -A 'Mozilla/5.0' https://dev.michahome.com.ar/health | python3 -c "import json,sys; print(json.load(sys.stdin)['release'])")"
          test "$CURRENT" = "$BASE_RELEASE" || { echo "Unexpected active release: $CURRENT" >&2; exit 90; }

      - name: Deploy 10 percent canary
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$BASE_VERSION@90" "$CANDIDATE_VERSION@10" \
            --name "$WORKER" --yes \
            --message "Temporary DEV stock/aroma canary 10 percent"

      - name: Validate canary traffic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, os
          allowed={os.environ['BASE_RELEASE'],os.environ['CANDIDATE_RELEASE']}
          seen={k:0 for k in allowed}
          for i in range(100):
              out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?canary={i}-{time.time_ns()}'])
              j=json.loads(out)
              assert j.get('ok') is True
              assert j.get('target')=='michayco-dev'
              assert j.get('production_locked') is True
              r=j.get('release'); assert r in allowed, r; seen[r]+=1
          print(json.dumps(seen))
          if seen[os.environ['CANDIDATE_RELEASE']] == 0: raise SystemExit('candidate_not_observed')
          PY

      - name: Restore baseline after successful canary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$BASE_VERSION@100" \
            --name "$WORKER" --yes \
            --message "Restore DEV baseline after stock/aroma canary"

      - name: Emergency rollback on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$BASE_VERSION@100" \
            --name "$WORKER" --yes \
            --message "Emergency restore DEV baseline after stock/aroma canary failure"

      - name: Verify baseline restored
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, os
          want=os.environ['BASE_RELEASE']; consecutive=0; deadline=time.time()+120; seen={}
          while time.time()<deadline:
              try:
                  out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?restore={time.time_ns()}'])
                  j=json.loads(out); r=j.get('release'); seen[r]=seen.get(r,0)+1
                  assert j.get('production_locked') is True
                  consecutive=consecutive+1 if r==want else 0
                  if consecutive>=12: print(json.dumps({'stable_release':want,'seen':seen})); break
              except Exception: consecutive=0
              time.sleep(1)
          else: raise SystemExit(f'baseline_not_stable seen={seen}')
          PY
