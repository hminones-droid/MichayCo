name: Micha DEV contingency - canary and rollback

on:
  push:
    branches: [contingency-dev]
    paths:
      - 'contingency/canary-trigger.txt'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: michayco-dev
      BASE_VERSION: 9779ae63-72a7-454c-9177-ad04b5a44d78
      CANDIDATE_VERSION: 431ed7b9-2ffd-4270-af45-968795993637
      BASE_RELEASE: dev-admin-tablefix-20261018-26
      CANDIDATE_RELEASE: dev-ui-clean-30
    steps:
      - uses: actions/checkout@v4
      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKER" = "michayco-dev"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          CURRENT="$(curl -fsS -A 'Mozilla/5.0' https://dev.michahome.com.ar/health | python3 -c "import json,sys; print(json.load(sys.stdin)['release'])")"
          test "$CURRENT" = "$BASE_RELEASE" || { echo "Unexpected active release: $CURRENT" >&2; exit 90; }
      - name: Stage candidate at zero normal traffic
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy "$BASE_VERSION@100" "$CANDIDATE_VERSION@0" --name "$WORKER" --yes --message "Stage DEV UI candidate at zero traffic for validation"
      - name: Validate baseline and explicit candidate override
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, os, time
          base=os.environ['BASE_RELEASE']; cand=os.environ['CANDIDATE_RELEASE']; version=os.environ['CANDIDATE_VERSION']
          def get(path, override=False):
              cmd=['curl','-fsS','-A','Mozilla/5.0']
              if override: cmd += ['-H',f'Cloudflare-Workers-Version-Overrides: michayco-dev="{version}"']
              cmd += [f'https://dev.michahome.com.ar{path}?validation={time.time_ns()}']
              return subprocess.check_output(cmd)
          normal=json.loads(get('/health')); assert normal['release']==base and normal['production_locked'] is True
          forced=json.loads(get('/health',True)); assert forced['release']==cand and forced['production_locked'] is True
          admin=get('/admin',True).decode('utf-8'); assert 'Administración' in admin or 'Micha & Co' in admin
          products=get('/catalog-admin-v2-products.js',True).decode('utf-8')
          fixes=get('/catalog-admin-v2-fixes.js',True).decode('utf-8')
          tools=get('/admin-tools.js',True).decode('utf-8')
          css=get('/catalog-admin-v2.css',True).decode('utf-8')
          assert 'canonical-products-head' in products and 'data-product-delete' in products
          assert 'MutationObserver' not in fixes and 'decorateSupplyRows' not in fixes
          assert 'e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();' not in fixes.split('async function handleVisibilityClick',1)[1]
          assert "<th>Fragancia</th><th>Familia</th><th>Stock</th><th>SKU completo</th>" in tools
          assert "<th>Fragancia</th><th>Familia</th><th>Stock actual</th><th>Cantidad</th><th>SKU completo</th>" not in tools
          assert 'Ver todos los artículos' not in tools
          assert '.supply-v2-actions [data-supply-active].is-active' in css
          assert '.stock-sheet td:first-child small' in css
          print(json.dumps({'baseline':normal['release'],'candidate':forced['release'],'static_contract':'ok'}))
          PY
      - name: Emergency rollback on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy "$BASE_VERSION@100" --name "$WORKER" --yes --message "Emergency restore DEV baseline after candidate validation failure"
      - name: Verify normal traffic remains baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time, os
          want=os.environ['BASE_RELEASE']; consecutive=0; deadline=time.time()+90; seen={}
          while time.time()<deadline:
              try:
                  out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?normal={time.time_ns()}'])
                  j=json.loads(out); r=j.get('release'); seen[r]=seen.get(r,0)+1
                  assert j.get('production_locked') is True
                  consecutive=consecutive+1 if r==want else 0
                  if consecutive>=8: print(json.dumps({'stable_normal_release':want,'seen':seen})); break
              except Exception: consecutive=0
              time.sleep(1)
          else: raise SystemExit(f'baseline_not_stable seen={seen}')
          PY
