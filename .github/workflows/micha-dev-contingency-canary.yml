name: Micha DEV contingency - canary and rollback

on:
  push:
    branches: [contingency-dev]
    paths:
      - 'contingency/canary-trigger.txt'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: michayco-dev
      BASE_VERSION: cc831db0-0df3-4a35-99ed-b6f6628136e2
      CANDIDATE_VERSION: 8f5ea4c5-3198-4363-8732-3990e42c8f10
      BASE_RELEASE: dev-admin-ui-canonical-20261014-2
      CANDIDATE_RELEASE: dev-github-contingency-20261015-2
    steps:
      - uses: actions/checkout@v4

      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKER" = "michayco-dev"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          CURRENT="$(curl -fsS -A 'Mozilla/5.0' https://dev.michahome.com.ar/health | python3 -c "import json,sys; print(json.load(sys.stdin)['release'])")"
          test "$CURRENT" = "$BASE_RELEASE" || { echo "Unexpected active release: $CURRENT" >&2; exit 90; }

      - name: Deploy 10 percent canary
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$BASE_VERSION@90" "$CANDIDATE_VERSION@10" \
            --name "$WORKER" --yes \
            --message "Temporary DEV contingency canary 10 percent"

      - name: Validate canary traffic
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time
          allowed={'dev-admin-ui-canonical-20261014-2','dev-github-contingency-20261015-2'}
          seen={k:0 for k in allowed}
          for i in range(80):
              out=subprocess.check_output(['curl','-fsS','-A','Mozilla/5.0',f'https://dev.michahome.com.ar/health?canary={i}-{time.time_ns()}'])
              j=json.loads(out)
              assert j.get('ok') is True
              assert j.get('target')=='michayco-dev'
              assert j.get('production_locked') is True
              r=j.get('release')
              assert r in allowed, r
              seen[r]+=1
          print(json.dumps(seen))
          if seen['dev-github-contingency-20261015-2'] == 0:
              raise SystemExit('candidate_not_observed')
          PY

      - name: Restore baseline after successful canary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$BASE_VERSION@100" \
            --name "$WORKER" --yes \
            --message "Restore DEV baseline after successful contingency canary"

      - name: Emergency rollback on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 versions deploy \
            "$BASE_VERSION@100" \
            --name "$WORKER" --yes \
            --message "Emergency restore DEV baseline after contingency canary failure"

      - name: Verify baseline restored
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          for i in $(seq 1 10); do
            R="$(curl -fsS -A 'Mozilla/5.0' "https://dev.michahome.com.ar/health?restore=$i-$(date +%s%N)" | python3 -c "import json,sys; print(json.load(sys.stdin)['release'])")"
            test "$R" = "$BASE_RELEASE" || { echo "Baseline not restored: $R" >&2; exit 95; }
          done
