<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin demo — Micha & Co</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand">Micha & Co<small>Administrador · prototipo</small></div><a class="btn ghost" href="index.html">Ver tienda</a></header><main class="section"><h1 style="font-size:52px">Administración</h1><p><b>DEMO:</b> todavía no hay autenticación ni base de datos productiva.</p><section class="card" style="padding:25px;margin:25px 0"><h2>Productos</h2><div id="adminProducts"></div></section><section class="card" style="padding:25px"><h2>Pedidos</h2><p>Nuevo → Pendiente de pago → Pago informado → Pago confirmado → Preparando → Enviado/Entregado → Cancelado.</p></section></main><script>fetch('products.json').then(r=>r.json()).then(p=>adminProducts.innerHTML=p.map(x=>`<div class="cart-row"><span><b>${x.name}</b><br>${x.category}</span><span>$${x.price.toLocaleString('es-AR')}</span></div>`).join(''))</script></body></html>
